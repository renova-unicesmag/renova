<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visor Interactivo Renova</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Estilos específicos para el Logo Líquido */
      .liquid-logo-wrapper {
        position: relative;
        width: 112px;
        height: 90px;
        /* ESCALADO 60% Y ALINEACIÓN */
        transform: scale(0.6);
        transform-origin: bottom left;
        filter: none;
      }

      /* CAPA 1: FONDO MATE Y SOMBRA INTERNA */
      .logo-glass-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        /* ILUMINACIÓN IGUALADA A BOTONES */
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.3) 0%,
          rgba(255, 255, 255, 0.2) 100%
        );
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        z-index: 1;
        /* SOMBRA INTERNA */
        box-shadow:
          inset 0 0 20px rgba(255, 255, 255, 0.25),
          inset 1px 1px 2px rgba(255, 255, 255, 0.4);
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }

      /* ILUMINACIÓN AL HOVER COMO LOS BOTONES */
      .logo-container:hover .logo-glass-layer {
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.4) 0%,
          rgba(255, 255, 255, 0.25) 100%
        );
        box-shadow:
          inset 0 0 25px rgba(255, 255, 255, 0.3),
          inset 1px 1px 5px rgba(255, 255, 255, 0.5),
          0 4px 15px rgba(0, 0, 0, 0.1);
      }

      /* CAPA 2: BORDE */
      .logo-stroke-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 2;
        pointer-events: none;
      }

      .logo-stroke-layer path {
        fill: none;
        stroke: rgba(255, 255, 255, 0.2);
        stroke-width: 1px;
        vector-effect: non-scaling-stroke;
        filter: none;
      }

      /* CLIPS */
      .clip-shape-1 {
        clip-path: url(#renova-clip-viewer);
      }
      .clip-shape-2 {
        clip-path: none;
      }
    </style>
  </head>

    <div id="viewport">
      <!-- GLOBAL WORLD WRAPPER -->
      <div id="world">
        <!-- MODO IMAGEN (JPG) ACTIVADO -->
        <img src="01.jpg" alt="Infografía Río Pasto" class="world-image" />
      </div>

      <!-- TOP UI LAYER (Always visible unless hidden, except eye icon) -->
      <div id="top-ui-layer">
        <!-- BOTÓN OCULTAR UI (Arriba Izquierda) -->
        <button
          class="circle-btn eye-btn"
          onclick="toggleUI()"
          title="Ocultar/Mostrar Interfaz (H)"
        >
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="feather feather-eye"
            id="eye-icon-visible"
          >
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="feather feather-eye-off hidden-icon"
            id="eye-icon-hidden"
          >
            <path
              d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
            ></path>
            <line x1="1" y1="1" x2="23" y2="23"></line>
          </svg>
        </button>

        <!-- BOTÓN FULLSCREEN (Arriba Derecha) -->
        <button
          class="circle-btn fullscreen-btn"
          onclick="toggleFullScreen()"
          title="Pantalla Completa (F11)"
        >
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="feather feather-maximize"
            id="fs-icon-maximize"
          >
            <path
              d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"
            ></path>
          </svg>
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="feather feather-minimize hidden-icon"
            id="fs-icon-minimize"
          >
            <path
              d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"
            ></path>
          </svg>
        </button>
      </div>

      <!-- UI LAYER BOTTOM -->
      <div id="ui-layer">

        <!-- PUNTOS CENTRADOS -->
        <div id="dots-container" class="pagination-dots"></div>

        <!-- BOTONES DERECHA -->
        <div class="nav-container">
          <div class="buttons-group">
            <button class="circle-btn" onclick="prevSlide()" title="Anterior">
              <svg
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"

            <button class="circle-btn" onclick="nextSlide()" title="Siguiente">
              <svg
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"

                <path d="M12 5l7 7-7 7" />

          </div>

      </div>
    </div>

    <script src="script.js"></script>
