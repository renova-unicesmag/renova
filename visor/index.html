<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Renova | Visor Interactivo</title>
    <link rel="icon" type="image/svg+xml" href="../logo-renova.svg" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Estilos específicos para el Logo Líquido */
      .liquid-logo-wrapper {
        position: relative;
        width: 112px;
        height: 90px;
        /* ESCALADO 60% Y ALINEACIÓN */
        transform: scale(0.6);
        transform-origin: bottom left;
        filter: none;
      }

      /* CAPA 1: FONDO MATE Y SOMBRA INTERNA */
      .logo-glass-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        /* ILUMINACIÓN IGUALADA A BOTONES */
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.3) 0%,
          rgba(255, 255, 255, 0.2) 100%
        );
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        z-index: 1;
        /* SOMBRA INTERNA */
        box-shadow:
          inset 0 0 20px rgba(255, 255, 255, 0.25),
          inset 1px 1px 2px rgba(255, 255, 255, 0.4);
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }

      /* ILUMINACIÓN AL HOVER COMO LOS BOTONES */
      .logo-container:hover .logo-glass-layer {
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.4) 0%,
          rgba(255, 255, 255, 0.25) 100%
        );
        box-shadow:
          inset 0 0 25px rgba(255, 255, 255, 0.3),
          inset 1px 1px 5px rgba(255, 255, 255, 0.5),
          0 4px 15px rgba(0, 0, 0, 0.1);
      }

      /* CAPA 2: BORDE */
      .logo-stroke-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 2;
        pointer-events: none;
      }

      .logo-stroke-layer path {
        fill: none;
        stroke: rgba(255, 255, 255, 0.2);
        stroke-width: 1px;
        vector-effect: non-scaling-stroke;
        filter: none;
      }

      /* CLIPS */
      .clip-shape-1 {
        clip-path: url(#renova-clip-viewer);
      }
      .clip-shape-2 {
        clip-path: none;
      }
    </style>
  </head>
  <body>
    <!-- Hidden SVG clipPath (scales to container via objectBoundingBox) -->
    <svg style="position: absolute; width: 0; height: 0" aria-hidden="true">
      <defs>
        <clipPath id="renova-clip-viewer" clipPathUnits="objectBoundingBox">
          <path
            transform="scale(0.005, 0.00625)"
            d="m60.04,81.75c-.06-1.98,1.04-3.8,2.82-4.65,10.13-4.81,17.14-15.13,17.14-27.1,0-16.84-13.88-30.44-30.82-29.99-16.36.43-29.18,14.3-29.18,30.67v79.32c0,5.52,4.47,10,10,10,4.39,0,8.12-2.83,9.46-6.76.67-1.97,2.6-3.24,4.68-3.24h15.86c0,16.84-13.88,30.44-30.82,29.99S0,145.69,0,129.32V50.87C0,23.43,21.74.44,49.18,0s50.82,22.1,50.82,49.99c0,16.02-7.54,30.29-19.27,39.44,6.12,28.54,36.53,52,65.74,50.55,31.72-1.57,33.53-24.98,33.53-40.05v-9.9s-.02-.05-.05-.05h-24.95c-2.76,0-5-2.24-5-5v-10c0-2.76,2.24-5,5-5h24.95s.05-.02.05-.05V31.05c0-5.55-4.5-10.05-10.05-10.05h-29.95c-4.39,0-8.12,2.83-9.46,6.76-.67,1.97-2.59,3.24-4.68,3.24h-15.86c0-16.57,13.43-30,30-30h30c16.56,0,30,13.43,30,30v68.9c0,38.33-17.98,60.09-54.69,60.09-38.95,0-71.87-26.11-82.46-61.68-1.96-6.59-2.7-12.81-2.81-16.56Z"
          />
        </clipPath>
      </defs>
    </svg>
    <div id="viewport">
      <!-- GLOBAL WORLD WRAPPER -->
      <div id="world">
        <!-- MODO IMAGEN (JPG) ACTIVADO -->
        <img src="01.jpg" alt="Infografía Río Pasto" class="world-image" />
      </div>

      <!-- TOP UI LAYER (Always visible unless hidden, except eye icon) -->
      <div id="top-ui-layer">
        <!-- BOTÓN OCULTAR UI (Arriba Izquierda) -->
        <button
          class="circle-btn eye-btn"
          onclick="toggleUI()"
          title="Ocultar/Mostrar Interfaz (H)"
        >
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="feather feather-eye"
            id="eye-icon-visible"
          >
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="feather feather-eye-off hidden-icon"
            id="eye-icon-hidden"
          >
            <path
              d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
            ></path>
            <line x1="1" y1="1" x2="23" y2="23"></line>
          </svg>
        </button>

        <!-- BOTÓN FULLSCREEN (Arriba Derecha) -->
        <button
          class="circle-btn fullscreen-btn"
          onclick="toggleFullScreen()"
          title="Pantalla Completa (F11)"
        >
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="feather feather-maximize"
            id="fs-icon-maximize"
          >
            <path
              d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"
            ></path>
          </svg>
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="feather feather-minimize hidden-icon"
            id="fs-icon-minimize"
          >
            <path
              d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"
            ></path>
          </svg>
        </button>
      </div>

      <!-- UI LAYER BOTTOM -->
      <div id="ui-layer">
        <!-- LOGO IZQUIERDA -->
        <a href="../index.html" class="logo-container" title="Volver a Renova">
          <div class="liquid-logo-wrapper">
            <div class="logo-glass-layer clip-shape-1"></div>
            <svg
              class="logo-stroke-layer"
              viewBox="0 0 200 160"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="m60.04,81.75c-.06-1.98,1.04-3.8,2.82-4.65,10.13-4.81,17.14-15.13,17.14-27.1,0-16.84-13.88-30.44-30.82-29.99-16.36.43-29.18,14.3-29.18,30.67v79.32c0,5.52,4.47,10,10,10,4.39,0,8.12-2.83,9.46-6.76.67-1.97,2.6-3.24,4.68-3.24h15.86c0,16.84-13.88,30.44-30.82,29.99S0,145.69,0,129.32V50.87C0,23.43,21.74.44,49.18,0s50.82,22.1,50.82,49.99c0,16.02-7.54,30.29-19.27,39.44,6.12,28.54,36.53,52,65.74,50.55,31.72-1.57,33.53-24.98,33.53-40.05v-9.9s-.02-.05-.05-.05h-24.95c-2.76,0-5-2.24-5-5v-10c0-2.76,2.24-5,5-5h24.95s.05-.02.05-.05V31.05c0-5.55-4.5-10.05-10.05-10.05h-29.95c-4.39,0-8.12,2.83-9.46,6.76-.67,1.97-2.59,3.24-4.68,3.24h-15.86c0-16.57,13.43-30,30-30h30c16.56,0,30,13.43,30,30v68.9c0,38.33-17.98,60.09-54.69,60.09-38.95,0-71.87-26.11-82.46-61.68-1.96-6.59-2.7-12.81-2.81-16.56Z"
              />
            </svg>
          </div>
        </a>

        <!-- PUNTOS CENTRADOS -->
        <div id="dots-container" class="pagination-dots"></div>

        <!-- BOTONES DERECHA -->
        <div class="nav-container">
          <div class="buttons-group">
            <button class="circle-btn" onclick="prevSlide()" title="Anterior">
              <svg
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M19 12H5" />
                <path d="M12 19l-7-7 7-7" />
              </svg>
            </button>
            <button class="circle-btn" onclick="nextSlide()" title="Siguiente">
              <svg
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M5 12h14" />
                <path d="M12 5l7 7-7 7" />
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
